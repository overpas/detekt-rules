name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - id: version
        run: .github/scripts/bump-version.sh "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}
      - run: ./gradlew check koverVerify ruleJars -Pversion="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: .github/scripts/publish-release.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
