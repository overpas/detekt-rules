overpas-architecture:
  active: true
  CatchWithoutResultType:
    active: false
  ConcreteCollaborator:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/ui-test/**']
    rootPackageDepth: 2
    areDataClassesIgnored: true
  ConstructedCollaborator:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/ui-test/**']
    excludedPackages: ['kotlin', 'kotlinx', 'java', 'javax', 'android', 'androidx']
  HardcodedUrl:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/ui-test/**', '**/*.gradle.kts']
    allowedPackageSegments: ['di']
    allowedUrlPrefixes: ['http://schemas.android.com/', 'http://www.w3.org/']
  HiddenAbstraction:
    active: true
  LowCohesion:
    active: true
    allowedComponents: 1
    minFunctions: 3
    ignoredFunctions: ['equals', 'hashCode', 'toString']
    areDataClassesIgnored: true
  NonInjectedDependency:
    active: true
    providerAnnotations: ['Provides', 'Binds']
  ProvidesInsteadOfInject:
    active: true
    providerAnnotations: ['Provides']
    rootPackageDepth: 2
  RepeatedCollaboratorType:
    active: true
    excludedTypes: ['kotlin.Boolean', 'kotlin.Char', 'kotlin.Number', 'kotlin.UByte', 'kotlin.UShort', 'kotlin.UInt', 'kotlin.ULong', 'kotlin.CharSequence', 'kotlin.collections.Iterable', 'kotlin.collections.Map', 'kotlin.Array', 'kotlin.BooleanArray', 'kotlin.CharArray', 'kotlin.ByteArray', 'kotlin.ShortArray', 'kotlin.IntArray', 'kotlin.LongArray', 'kotlin.FloatArray', 'kotlin.DoubleArray', 'kotlin.sequences.Sequence', 'kotlin.Function', 'kotlin.Enum', 'kotlin.time.Duration', 'kotlin.time.Instant', 'kotlin.uuid.Uuid', 'kotlin.coroutines.CoroutineContext', 'kotlinx.coroutines.CoroutineDispatcher']
    ignoredSupertypes: ['kotlin.Any', 'kotlin.Comparable', 'java.io.Serializable']
    areDataClassesIgnored: true
  StoreTypeLeak:
    active: false
    excludes: ['**/di/**']
    storeSuffix: 'Store'
    storeTypes: ['Intent', 'Action', 'Message', 'State', 'Label']
    allowedSubpackages: []
    componentTypes: ['Intent', 'State', 'Label']
    uiPackage: 'ui'
    uiTypes: ['State', 'Label']
  WeightedComplexity:
    active: true
    excludes: ['**/build/**', '**/generated/**']
    classLimit: 100
    fileLimit: 150
    testClassLimit: 550
    testFileLimit: 600
    composableClassLimit: 5
    composableFileLimit: 300
    functionLimit: 70
    testFunctionLimit: 90
    composableFunctionLimit: 300
    nestWeight: 0.25
    chainWeight: 0.1
    minFunctionScore: 1.0
    arePropertyTypeArgumentsCounted: true
    nestedClassScore: 1.0
    testSourcePatterns: ['**/src/test/**', '**/src/*Test/**']
    composableAnnotations: ['Composable']
